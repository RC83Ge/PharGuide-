name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-4oa5xy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # L'appli Android appelle l'API Gemini hébergée sur Vercel
      - name: Build web + sync Android
        run: npm run cap:sync
        env:
          VITE_API_BASE_URL: https://pharma-swart-seven.vercel.app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PharmaGuide-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
